<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewlix Player</title>
    <link rel="stylesheet" href="/css/player.css">
</head>
<body>
    <div id="playerRoot">
        <!-- Main Video Element -->
        <video id="player" playsinline preload="auto" onclick="togglePlay()"></video>

        <!-- Center Pulse Indicator -->
        <div class="center-action" id="centerAction">▶</div>

        <!-- Buffer Spinner Overlay -->
        <div class="spinner-overlay" id="spinner">
            <div class="spinner"></div>
            <div class="spinner-text" id="spinnerText">Loading media stream...</div>
        </div>

        <!-- Top-Center Audio Muted Pill (Screenshot Match) -->
        <div class="unmute-pill" id="unmutePill" style="display: none;" onclick="handleUnmuteClick()">
            <span class="unmute-icon">🔊</span>
            <span>Audio is muted — Click to unmute</span>
        </div>

        <!-- Top-Left Branding & Media Info -->
        <div class="top-bar" id="topBar">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                </svg>
                VIEWLIX
            </div>
            <div class="media-heading">
                <span class="media-title-text" id="mediaTitleText">Loading...</span>
                <span class="media-type-badge" id="mediaBadge">MEDIA</span>
                <span class="quality-badge" id="topQualityBadge">1080p</span>
            </div>
        </div>

        <!-- Bottom-Left Resume Pill (Screenshot Match) -->
        <div class="resume-pill" id="resumePill" style="display: none;">
            <div class="resume-dot"></div>
            <span class="resume-text" id="resumeText">Resumed at 0:00</span>
            <button class="btn-start-over" onclick="startOver()">Start Over</button>
            <button class="btn-close-resume" onclick="closeResumePill()">✕</button>
        </div>

        <!-- Bottom Controls Overlay (Screenshot Match) -->
        <div class="bottom-controls" id="bottomControls">
            <!-- Red Progress Timeline -->
            <div class="timeline-container" id="timeline">
                <div class="timeline-bg">
                    <div class="buffered-bar" id="bufferedBar"></div>
                    <div class="played-bar" id="playedBar"></div>
                    <div class="scrubber-thumb" id="scrubberThumb"></div>
                </div>
                <div class="time-tooltip" id="timeTooltip">00:00</div>
            </div>

            <!-- Controls Row -->
            <div class="controls-row">
                <div class="left-ctrls">
                    <!-- Play / Pause -->
                    <button class="icon-btn" id="playPauseBtn" onclick="togglePlay()" title="Play/Pause (Space)">
                        <svg viewBox="0 0 24 24" id="playIcon">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg viewBox="0 0 24 24" id="pauseIcon" style="display: none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </button>

                    <!-- Skip Back 10s -->
                    <button class="icon-btn" onclick="skip(-10)" title="Rewind 10s (←)">
                        <svg viewBox="0 0 24 24">
                            <path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.2 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
                        </svg>
                    </button>

                    <!-- Skip Forward 10s -->
                    <button class="icon-btn" onclick="skip(10)" title="Forward 10s (→)">
                        <svg viewBox="0 0 24 24">
                            <path d="M11.5 8c2.65 0 5.05.99 6.9 2.6L22 7v9h-9l3.62-3.62c-1.39-1.2-3.16-1.88-5.12-1.88-3.54 0-6.55 2.31-7.6 5.5l-2.37-.78C2.92 11.03 6.85 8 11.5 8z"/>
                        </svg>
                    </button>

                    <!-- Volume -->
                    <div class="volume-group">
                        <button class="icon-btn" id="volBtn" onclick="toggleMute()" title="Mute (M)">
                            <svg viewBox="0 0 24 24" id="volHighIcon">
                                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                            </svg>
                            <svg viewBox="0 0 24 24" id="volMuteIcon" style="display: none;">
                                <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                            </svg>
                        </button>
                        <input type="range" class="volume-slider" id="volSlider" min="0" max="1" step="0.05" value="1" oninput="updateVolume(this.value)">
                    </div>

                    <!-- Time Display -->
                    <span class="time-stamp" id="timeStamp">00:00 / 00:00</span>
                </div>

                <div class="right-ctrls">
                    <!-- Stream Quality Selector Button -->
                    <div class="quality-wrapper">
                        <button class="quality-btn" id="qualityBtn" onclick="toggleQualityMenu()" title="Stream Quality">
                            <span id="currentQualityLabel">1080p</span>
                        </button>
                        <!-- Quality Dropdown Menu -->
                        <div class="quality-menu" id="qualityMenu">
                            <div class="quality-menu-header">QUALITY</div>
                            <div id="qualityOptionsList">
                                <!-- Populated dynamically -->
                            </div>
                        </div>
                    </div>

                    <!-- Settings Gear -->
                    <button class="icon-btn" id="settingsBtn" onclick="toggleSettings()" title="Settings">
                        <svg viewBox="0 0 24 24">
                            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                        </svg>
                    </button>

                    <!-- Picture-in-Picture -->
                    <button class="icon-btn" onclick="togglePip()" title="Picture in Picture (P)">
                        <svg viewBox="0 0 24 24">
                            <path d="M19 7h-8v6h8V7zm2-4H3c-1.1 0-2 .9-2 2v14c0 1.1.9 1.98 2 1.98h18c1.1 0 2-.88 2-1.98V5c0-1.1-.9-2-2-2zm0 16.01H3V4.98h18v14.03z"/>
                        </svg>
                    </button>

                    <!-- Fullscreen -->
                    <button class="icon-btn" onclick="toggleFullscreen()" title="Fullscreen (F)">
                        <svg viewBox="0 0 24 24">
                            <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                        </svg>
                    </button>

                    <!-- Small Brand Watermark -->
                    <span class="brand-watermark">VIEWLIX</span>
                </div>
            </div>
        </div>

        <!-- Floating Settings Menu -->
        <div class="settings-menu" id="settingsMenu">
            <div class="settings-header">
                <span>Player Settings</span>
                <span style="font-size: 0.75rem; color: #ef4444; font-weight: 700;" id="settingsQualityBadge">1080p HD</span>
            </div>

            <div>
                <div class="settings-section-title">Video Quality</div>
                <select class="server-select" id="qualitySelect" onchange="handleQualitySelect(this.value)">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <div>
                <div class="settings-section-title">Streaming Server</div>
                <select class="server-select" id="serverSelect" onchange="handleServerChange(this.value)">
                    <!-- Populated dynamically -->
                </select>
            </div>

            <div class="audio-toggle-row">
                <span class="audio-toggle-label">Browser Audio Fix (AAC Transcode)</span>
                <label class="switch">
                    <input type="checkbox" id="audioFixSwitch" checked onchange="toggleAudioTranscode()">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Notification Toast -->
        <div class="toast-notice" id="toastNotice"></div>
    </div>

    <script src="/js/player.js"></script>
</body>
</html>
