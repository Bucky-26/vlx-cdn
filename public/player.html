<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Viewlix Player</title>
    
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Plyr.io CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css">

    <!-- Custom Netflix/HBO Theme & Episode Drawer Styles -->
    <link rel="stylesheet" href="/css/player.css?v=2.0.8">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍿</text></svg>">
</head>
<body>
    <div id="playerRoot" class="player-root">

        <!-- Video Player Element (Plyr wraps this) -->
        <div class="video-container" id="videoContainer">
            <video id="player" playsinline webkit-playsinline x5-playsinline preload="metadata" crossorigin="anonymous"></video>
            
            <!-- Netflix-Style Central Buffering Spinner -->
            <div class="buffering-spinner" id="bufferingSpinner" style="display: none;">
                <div class="netflix-buffering-ring"></div>
            </div>

            <!-- Mobile Double Tap Seek Ripples -->
            <div class="seek-ripple seek-ripple-left" id="rippleLeft">
                <div class="ripple-circle">
                    <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
                    <span>10s</span>
                </div>
            </div>
            <div class="seek-ripple seek-ripple-right" id="rippleRight">
                <div class="ripple-circle">
                    <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
                    <span>10s</span>
                </div>
            </div>
        </div>

        <!-- Top Floating Navigation & Info Bar -->
        <div class="top-bar" id="topBar">
            <div class="top-bar-left">
                <a href="/" class="brand-logo" onclick="event.preventDefault()">
                    <span class="brand-v">V</span>
                    <span class="brand-text">VIEWLIX</span>
                </a>
                <div class="title-meta-group">
                    <div class="title-row">
                        <span class="media-title-text" id="mediaTitleText">Loading title...</span>
                        <span class="media-type-badge" id="mediaBadge">MEDIA</span>
                        <span class="quality-badge" id="topQualityBadge">1080p</span>
                    </div>
                    <div class="episode-subtitle" id="mediaSubtitleText" style="display: none;">
                        <!-- S1:E1 • Welcome to Margrave -->
                    </div>
                </div>
            </div>

            <div class="top-bar-right">
                <!-- TV Episodes Drawer Button (Netflix/HBO style) -->
                <button class="top-action-btn tv-episodes-btn" id="btnEpisodesToggle" onclick="toggleEpisodesDrawer()" style="display: none;" title="Seasons & Episodes">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/>
                    </svg>
                    <span>Episodes</span>
                </button>

                <!-- Next Episode Button (TV only) -->
                <button class="top-action-btn tv-next-btn" id="btnNextEp" onclick="playNextEpisode()" style="display: none;" title="Next Episode">
                    <svg viewBox="0 0 24 24">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                    <span>Next Ep</span>
                </button>

                <!-- Server & Quality Dropdown Button -->
                <button class="top-action-btn server-btn" id="btnServerToggle" onclick="toggleServerModal()" title="Streaming Servers">
                    <svg viewBox="0 0 24 24">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
                    </svg>
                    <span id="activeServerLabel">Server 1 (1080p)</span>
                </button>
            </div>
        </div>

        <!-- Buffer Spinner Overlay -->
        <div class="spinner-overlay" id="spinner">
            <div class="spinner-ring"></div>
            <div class="spinner-text" id="spinnerText">Connecting to high-speed stream...</div>
            <div class="spinner-subtext" id="spinnerSubtext">Selecting best peer source</div>
        </div>

        <!-- Top-Center Audio Muted Pill -->
        <div class="unmute-pill" id="unmutePill" style="display: none;" onclick="handleUnmuteClick()">
            <span class="unmute-icon">🔊</span>
            <span>Audio is muted — Click to unmute</span>
        </div>

        <!-- Bottom-Left Resume Pill -->
        <div class="resume-pill" id="resumePill" style="display: none;">
            <div class="resume-dot"></div>
            <span class="resume-text" id="resumeText">Resumed at 0:00</span>
            <button class="btn-start-over" onclick="startOver()">Start Over</button>
            <button class="btn-close-resume" onclick="closeResumePill()">✕</button>
        </div>

        <!-- Netflix / HBO Style Slide-Out Seasons & Episodes Drawer -->
        <div class="episodes-drawer-backdrop" id="drawerBackdrop" onclick="closeEpisodesDrawer()"></div>
        <aside class="episodes-drawer" id="episodesDrawer">
            <div class="drawer-header">
                <div class="drawer-header-info">
                    <h2 class="drawer-show-title" id="drawerShowTitle">Episodes</h2>
                    <div class="season-selector-wrapper">
                        <select class="season-dropdown" id="seasonSelect" onchange="onSeasonChange(this.value)">
                            <!-- Populated dynamically -->
                        </select>
                    </div>
                </div>
                <button class="drawer-close-btn" onclick="closeEpisodesDrawer()" title="Close Drawer (Esc)">✕</button>
            </div>

            <!-- Scrollable Episode Cards Grid -->
            <div class="episodes-cards-container" id="episodesCardsList">
                <!-- Episode cards injected dynamically -->
            </div>
        </aside>

        <!-- Netflix-Style Next Episode Auto-Prompt Card -->
        <div class="next-episode-prompt" id="nextEpPrompt" style="display: none;">
            <div class="next-prompt-thumb-wrap">
                <img id="nextPromptThumb" src="" alt="Next Episode">
                <div class="next-prompt-countdown" id="nextPromptCountdown">10</div>
            </div>
            <div class="next-prompt-info">
                <div class="next-prompt-label">UP NEXT</div>
                <div class="next-prompt-title" id="nextPromptTitle">Episode Title</div>
                <div class="next-prompt-actions">
                    <button class="btn-prompt-play" onclick="playNextEpisode()">Play Now</button>
                    <button class="btn-prompt-dismiss" onclick="dismissNextPrompt()">Dismiss</button>
                </div>
            </div>
        </div>

        <!-- Floating Server & Quality Settings Modal -->
        <div class="server-modal-backdrop" id="serverModalBackdrop" onclick="closeServerModal()"></div>
        <div class="server-modal" id="serverModal">
            <div class="modal-header">
                <h3>Streaming Quality & Servers</h3>
                <button class="modal-close-btn" onclick="closeServerModal()">✕</button>
            </div>

            <div class="modal-body">
                <div class="modal-section">
                    <label class="modal-label">Video Quality</label>
                    <div class="quality-pills" id="qualityPills">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <div class="modal-section">
                    <label class="modal-label">Streaming Server</label>
                    <div class="server-list" id="serverList">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <div class="modal-section toggle-row">
                    <div class="toggle-info">
                        <span class="toggle-title">Browser Audio Fix</span>
                        <span class="toggle-desc">Transcode 5.1/DTS/AC3 audio for web compatibility</span>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="audioFixSwitch" checked onchange="toggleAudioTranscode()">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <!-- Notification Toast -->
        <div class="toast-notice" id="toastNotice"></div>
    </div>

    <!-- Plyr.io JS (Polyfilled for full browser compatibility) -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <!-- Player App Script -->
    <script src="/js/player.js?v=2.0.8"></script>
</body>
</html>
